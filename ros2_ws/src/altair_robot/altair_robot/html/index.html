<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>RPLidar Sonar Monitor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── ヘッダー ── */
        #header {
            background: #16213e;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        #status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            display: inline-block;
            margin-right: 6px;
        }

        #status-dot.ok {
            background: #2ecc71;
        }

        #status-txt {
            font-size: 13px;
        }

        /* ── ポーズ表示 ── */
        #pose-panel {
            background: #0f3460;
            padding: 6px 12px;
            font-size: 14px;
            flex-shrink: 0;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        #pose-panel span {
            white-space: nowrap;
        }

        /* ── メインエリア ── */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 12px;
            min-height: 0;
        }

        /* ── ソナーキャンバス ── */
        #sonar-container {
            flex: 1;
            background: radial-gradient(circle at 50% 75%, #0f334f 0%, #091a2f 45%, #060d1b 100%);
            border: 1px solid #2a9d8f;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #scan-canvas {
            max-width: 100%;
            max-height: 100%;
            background: transparent;
        }

        /* ── 制御パネル ── */
        #control-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 280px;
            min-width: 280px;
        }

        #btn-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        #btn-reset-pose {
            background: #1f7a8c;
        }

        #btn-full-reset {
            background: #b63f2a;
        }

        #status-box {
            flex: 0 0 140px;
            background: #0c2845;
            border: 1px solid #295a86;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.4;
            min-height: 0;
        }

        /* ── レスポンシブ ── */
        @media (max-width: 1024px) {
            #main-area {
                flex-direction: column;
            }

            #control-panel {
                width: auto;
                min-width: auto;
            }

            #sonar-container {
                aspect-ratio: 4 / 3;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <div id="header">
        <div>
            <span id="status-dot"></span>
            <span id="status-txt">未接続</span>
        </div>
        <div id="ip-area">
            <span id="ws-target" style="font-size:12px;color:#b8d6ff;"></span>
            <button onclick="connectWS(true)" style="background:#2ecc71;color:#fff;border:none;padding:4px 8px;
             border-radius:4px;font-size:12px;cursor:pointer;margin-left:8px;">再接続</button>
        </div>
    </div>

    <!-- ポーズ表示 -->
    <div id="pose-panel">
        <span>X: <b id="p-x">--</b> m</span>
        <span>Y: <b id="p-y">--</b> m</span>
        <span>θ: <b id="p-th">--</b>°</span>
        <span style="margin-left: auto; color: #9fdcbf;">LiDAR: <b id="scan-status">--</b></span>
    </div>

    <!-- メインエリア -->
    <div id="main-area">
        <!-- ソナー表示 -->
        <div id="sonar-container">
            <canvas id="scan-canvas" width="700" height="700"></canvas>
        </div>

        <!-- 制御パネル -->
        <div id="control-panel">
            <div id="btn-row">
                <button class="btn" id="btn-reset-pose" onclick="resetPose()">位置リセット</button>
                <button class="btn" id="btn-full-reset" onclick="fullReset()">完全リセット</button>
            </div>
            <div id="status-box">待機中...</div>
        </div>
    </div>

    <script>
        // ─── 設定 ────────────────────────────────────────────────
        const WS_PORT = 8876;
        const RECONNECT_MS = 2000;
        let ws = null;
        let reconnectTimer = null;

        // LiDARデータ
        let scanData = null;
        let sweepPhase = 0;
        let lastScanLogMs = 0;

        function wsHost() {
            const host = window.location.hostname;
            return host && host.length > 0 ? host : '127.0.0.1';
        }

        function wsUrl() {
            const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            return `${scheme}://${wsHost()}:${WS_PORT}`;
        }

        function updateTargetLabel() {
            const el = document.getElementById('ws-target');
            el.textContent = `WS: ${wsHost()}:${WS_PORT}`;
        }

        function appendStatus(msg) {
            const box = document.getElementById('status-box');
            const now = new Date().toLocaleTimeString();
            const line = `[${now}] ${msg}`;
            box.innerHTML = line + '<br>' + box.innerHTML;
            // 最大10行まで（ログが増殖しないように制限）
            const lines = box.innerHTML.split('<br>').slice(0, 10).join('<br>');
            box.innerHTML = lines;
        }

        // ─── ソナー描画 ─────────────────────────────────────
        function drawSonarBackground(ctx, w, h, cx, cy, radius) {
            ctx.clearRect(0, 0, w, h);

            // 同心円
            ctx.strokeStyle = 'rgba(90, 255, 215, 0.24)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                const r = (radius * i) / 5;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 十字ガイド
            ctx.strokeStyle = 'rgba(120, 220, 255, 0.20)';
            ctx.beginPath();
            ctx.moveTo(cx, cy - radius);
            ctx.lineTo(cx, cy + radius);
            ctx.moveTo(cx - radius, cy);
            ctx.lineTo(cx + radius, cy);
            ctx.stroke();

            // 正面マーカー（上）
            ctx.strokeStyle = 'rgba(255, 230, 130, 0.65)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - radius - 10);
            ctx.lineTo(cx, cy - radius + 10);
            ctx.stroke();

            // スイープ
            const a = sweepPhase;
            const sx = cx + Math.cos(a) * radius;
            const sy = cy + Math.sin(a) * radius;
            const grad = ctx.createLinearGradient(cx, cy, sx, sy);
            grad.addColorStop(0, 'rgba(80, 255, 210, 0.02)');
            grad.addColorStop(1, 'rgba(80, 255, 210, 0.25)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();

            // 中心点
            ctx.fillStyle = 'rgba(255, 95, 95, 0.95)';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function renderScan() {
            const canvas = document.getElementById('scan-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const w = canvas.width;
            const h = canvas.height;
            const cx = w * 0.5;
            const cy = h * 0.5;
            const radius = Math.min(w, h) * 0.45;

            drawSonarBackground(ctx, w, h, cx, cy, radius);

            if (!scanData || !Array.isArray(scanData.points) || scanData.points.length === 0) {
                return;
            }

            const rangeMax = Math.max(0.1, Number(scanData.rangeMax || 12.0));
            const scale = radius / rangeMax;

            // 点群: 上が正面 (x forward)、中心がロボット
            ctx.fillStyle = 'rgba(60, 255, 170, 0.95)';
            for (const p of scanData.points) {
                const x = Number(p[0]);
                const y = Number(p[1]);
                if (!Number.isFinite(x) || !Number.isFinite(y)) continue;

                const sx = cx - y * scale;
                const sy = cy - x * scale;

                if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
                ctx.fillRect(sx - 1, sy - 1, 2.4, 2.4);
            }
        }

        function updateScanData(data) {
            scanData = data;
            const statusEl = document.getElementById('scan-status');
            const n = Number(data.pointCount || 0);
            const r = Number(data.rangeMax || 0);
            statusEl.textContent = `${n} pts / ${r.toFixed(1)} m`;

            const now = Date.now();
            if (now - lastScanLogMs > 1000) {
                lastScanLogMs = now;
                appendStatus(`LiDAR受信: ${n} 点`);
            }

            renderScan();
        }

        function animateSonar() {
            sweepPhase += 0.025;
            if (sweepPhase > Math.PI * 2) sweepPhase -= Math.PI * 2;
            renderScan();
            requestAnimationFrame(animateSonar);
        }

        // ─── WebSocket ───────────────────────────────────────────
        function connectWS(isManual = false) {
            const url = wsUrl();
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-txt');
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (ws) { try { ws.close(); } catch (e) { } }
            txt.textContent = '接続中…';
            ws = new WebSocket(url);
            ws.onopen = () => {
                dot.className = 'ok';
                txt.textContent = `接続済`;
                appendStatus('WebSocket 接続に成功しました');
            };
            ws.onclose = () => {
                dot.className = '';
                txt.textContent = '切断';
                appendStatus('WebSocket が切断されました');
                ws = null;
                reconnectTimer = setTimeout(() => connectWS(false), RECONNECT_MS);
            };
            ws.onerror = () => {
                txt.textContent = '接続エラー';
                if (isManual) {
                    appendStatus('接続エラー');
                }
            };
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    if (d.type === 'pose') {
                        document.getElementById('p-x').textContent = d.x.toFixed(2);
                        document.getElementById('p-y').textContent = d.y.toFixed(2);
                        document.getElementById('p-th').textContent = (d.theta * 180 / Math.PI).toFixed(1);
                    } else if (d.type === 'scan') {
                        updateScanData(d);
                    } else if (d.type === 'status') {
                        appendStatus(`${d.ok ? 'OK' : 'NG'}: ${d.message}`);
                    }
                } catch (err) {
                    console.error('Message parse error:', err);
                }
            };
        }

        function sendMessage(type) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type }));
        }

        function resetPose() {
            sendMessage('reset_pose');
            appendStatus('位置リセット要求を送信しました');
        }

        function fullReset() {
            const ok = window.confirm('地図を含む完全リセットを実行します。よろしいですか？');
            if (!ok) return;
            sendMessage('full_reset');
            appendStatus('完全リセット要求を送信しました');
        }

        updateTargetLabel();
        connectWS(false);
        requestAnimationFrame(animateSonar);
    </script>
</body>

</html>
