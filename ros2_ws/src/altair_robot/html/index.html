<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>RPLidar Localization Monitor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── ヘッダー ── */
        #header {
            background: #16213e;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        #status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            display: inline-block;
            margin-right: 6px;
        }

        #status-dot.ok {
            background: #2ecc71;
        }

        #status-txt {
            font-size: 13px;
        }

        /* ── ポーズ表示 ── */
        #pose-panel {
            background: #0f3460;
            padding: 6px 12px;
            font-size: 16px;
            flex-shrink: 0;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        #pose-panel span {
            white-space: nowrap;
        }

        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px;
        }

        #status-box {
            width: min(720px, 92vw);
            min-height: 120px;
            background: #0c2845;
            border: 1px solid #295a86;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        #btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #btn-reset-pose {
            background: #1f7a8c;
        }

        #btn-full-reset {
            background: #b63f2a;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <div id="header">
        <div>
            <span id="status-dot"></span>
            <span id="status-txt">未接続</span>
        </div>
        <div id="ip-area">
            <span id="ws-target" style="font-size:13px;color:#b8d6ff;"></span>
            <button onclick="connectWS(true)" style="background:#2ecc71;color:#fff;border:none;padding:4px 8px;
             border-radius:4px;font-size:13px;cursor:pointer;">再接続</button>
        </div>
    </div>

    <!-- ポーズ表示 -->
    <div id="pose-panel">
        <span>X: <b id="p-x">--</b> m</span>
        <span>Y: <b id="p-y">--</b> m</span>
        <span>θ: <b id="p-th">--</b>°</span>
    </div>

    <div id="main-area">
        <div id="btn-row">
            <button class="btn" id="btn-reset-pose" onclick="resetPose()">位置リセット</button>
            <button class="btn" id="btn-full-reset" onclick="fullReset()">完全リセット（地図削除）</button>
        </div>

        <div id="status-box">待機中...</div>
    </div>

    <script>
        // ─── 設定 ────────────────────────────────────────────────
        const WS_PORT = 8876;
        const RECONNECT_MS = 2000;
        let ws = null;
        let reconnectTimer = null;

        function wsHost() {
            const host = window.location.hostname;
            return host && host.length > 0 ? host : '127.0.0.1';
        }

        function wsUrl() {
            const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            return `${scheme}://${wsHost()}:${WS_PORT}`;
        }

        function updateTargetLabel() {
            const el = document.getElementById('ws-target');
            el.textContent = `接続先: ${wsHost()}:${WS_PORT}`;
        }

        function appendStatus(msg) {
            const box = document.getElementById('status-box');
            const now = new Date().toLocaleTimeString();
            box.innerHTML = `[${now}] ${msg}<br>` + box.innerHTML;
        }

        // ─── WebSocket ───────────────────────────────────────────
        function connectWS(isManual = false) {
            const url = wsUrl();
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-txt');
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (ws) { try { ws.close(); } catch (e) { } }
            txt.textContent = '接続中…';
            ws = new WebSocket(url);
            ws.onopen = () => {
                dot.className = 'ok';
                txt.textContent = `接続済 ${wsHost()}:${WS_PORT}`;
                appendStatus('WebSocket 接続に成功しました');
            };
            ws.onclose = () => {
                dot.className = '';
                txt.textContent = '切断';
                appendStatus('WebSocket が切断されました');
                ws = null;
                reconnectTimer = setTimeout(() => connectWS(false), RECONNECT_MS);
            };
            ws.onerror = () => {
                txt.textContent = '接続エラー';
                if (isManual) {
                    appendStatus('接続エラー');
                }
            };
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    if (d.type === 'pose') {
                        document.getElementById('p-x').textContent = d.x.toFixed(2);
                        document.getElementById('p-y').textContent = d.y.toFixed(2);
                        document.getElementById('p-th').textContent = (d.theta * 180 / Math.PI).toFixed(1);
                    } else if (d.type === 'status') {
                        appendStatus(`${d.ok ? 'OK' : 'NG'}: ${d.message}`);
                    }
                } catch (err) { }
            };
        }

        function sendMessage(type) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type }));
        }

        function resetPose() {
            sendMessage('reset_pose');
            appendStatus('位置リセット要求を送信しました');
        }

        function fullReset() {
            const ok = window.confirm('地図を含む完全リセットを実行します。よろしいですか？');
            if (!ok) return;
            sendMessage('full_reset');
            appendStatus('完全リセット要求を送信しました');
        }

        updateTargetLabel();
        connectWS(false);
    </script>
</body>

</html>
